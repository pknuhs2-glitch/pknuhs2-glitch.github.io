# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Language and timezone
lang: ko-KR
timezone: Asia/Seoul

# Site information
title: OSS WebPage
tagline: OSS_102
description: >-
  OpenSource Software Blog.

# Site URL
url: "https://pknuhs2-glitch.github.io"
baseurl: ""

# GitHub account
github:
  username: pknuhs2-glitch

# Twitter account
twitter:
  username:

# Social information
social:
  name: KHS
  email:
  fediverse_handle:
  links:
    - https://github.com/pknuhs2-glitch

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# Prefer color scheme setting
theme_mode:

# CDN endpoint
cdn:

# Sidebar avatar
avatar:

# Social preview image
social_preview_image:

# Table of Contents
toc: true

# Actions
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# Comments
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:

# PWA settings
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination
paginate: 10

# ------------ The following options are not recommended to be modified ------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
